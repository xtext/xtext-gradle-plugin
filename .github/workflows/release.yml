name: Release

on:
  release:
    types: [published]

jobs:
  build:
    name: Release
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - id: get_version
        name: Get Version
        # Tags carry no 'v' prefix (e.g. 4.0.0), so the release tag is the version.
        run: echo "version=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Verify
        run: ./gradlew build "-PreleaseVersion=${{ steps.get_version.outputs.version }}"
      - name: Release
        run: ./gradlew publishPlugins "-PreleaseVersion=${{ steps.get_version.outputs.version }}"
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
