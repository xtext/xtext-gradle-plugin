name: Build

on:
  push:
    branches: 
      - master
  pull_request:

jobs:
  build:
    name: Build
    strategy:
       matrix:
          java: [21]
          os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Build
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build
      - name: Store HTML test report
        uses: actions/upload-artifact@v4
        with:
          name: test-report-html-${{ matrix.os }}
          path: "**/reports/tests/**\n**/reports/integTest/**"
          if-no-files-found: ignore
      - name: Store XML test report
        uses: actions/upload-artifact@v4
        with:
          name: test-results-xml-${{ matrix.os }}
          path: "**/test-results/**\n**/integTest-results/**"
          if-no-files-found: ignore